<div class="flex h-screen relative">
  <!-- Custom Side Menu -->
  <div
    class="bg-neutral-100 dark:bg-neutral-800 border-r border-neutral-200 dark:border-neutral-700 z-50 fixed md:relative h-full top-0 left-0 w-[320px] transition-transform duration-300 ease-in-out"
    [ngClass]="{
    'translate-x-0': !menuCollapsed,
    '-translate-x-full': menuCollapsed}">
    <div class="px-4 pt-4">
      <app-sidebar />
    </div>
  </div>

  <!-- Backdrop en móvil -->
  @if (!menuCollapsed) {
  <div class="fixed inset-0 bg-black/30 z-40 md:hidden transition-opacity duration-700" (click)="toggleMenu()">
  </div>
  }

  <!-- Sidebar del artículo -->
  <div
    class="fixed top-0 right-0 h-full w-full md:w-[800px] z-[100] bg-white dark:bg-neutral-900 shadow-2xl transition-transform duration-300 flex flex-col"
    [class.translate-x-full]="!sidebarService.isArticleSidebarOpen()">
    <!-- Encabezado -->
    <div class="flex items-center justify-between p-4 border-b border-neutral-200 dark:border-neutral-700">
      <h2 class="text-lg font-semibold text-black dark:text-white">Artículo</h2>
      <button (click)="sidebarService.close()"
        class="min-w-10 min-h-10 w-10 h-10 rounded-full hover:bg-neutral-200 dark:hover:bg-neutral-700 flex items-center justify-center">
        <span class="ph ph-x text-xl text-neutral-700 dark:text-neutral-300"></span>
      </button>
    </div>
    <div class="flex-1 overflow-y-auto mb-10">
      <!-- Contenido -->
      <app-article />
    </div>
  </div>

  <!-- Backdrop -->
  @if (sidebarService.isArticleSidebarOpen()) {
  <div class="fixed inset-0 bg-black/30 z-[99]" (click)="sidebarService.close()"></div>
  }


  <!-- Backdrop -->
  @if (sidebarService.isArticleSidebarOpen()) {
  <div class="fixed inset-0 bg-black/30 z-[99]" (click)="sidebarService.close()"></div>
  }


  <!-- Main Content -->
  <div class="flex-1 flex flex-col transition-all duration-300 ease-in-out min-w-0" [ngClass]="{
    'md:-ml-[320px]': menuCollapsed}">
    <app-header (toggleMenu)="toggleMenu()" />
    <main class="flex-1 min-h-0 min-w-0 overflow-y-auto bg-neutral-100 dark:bg-neutral-800">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
