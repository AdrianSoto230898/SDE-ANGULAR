<label class="inline-flex items-center gap-2 cursor-pointer" [class.opacity-60]="disabled() || isDisabled"
    [class.cursor-not-allowed]="disabled() || isDisabled">
    <div class="relative flex items-center justify-center w-5 h-5 rounded border transition-colors duration-200"
        [ngClass]="{
         'bg-primary border-primary dark:border-primary': checked(),
         'bg-transparent border-neutral-300 dark:border-neutral-600': !checked(),
         'ring-2 ring-primary/20': focused && !disabled() && !isDisabled
       }" (click)="toggle($event)">

        <input type="checkbox" class="sr-only" [checked]="checked()" [disabled]="disabled() || isDisabled"
            (focus)="focused = true" (blur)="focused = false">

        @if (checked()) {
        <svg class="w-3.5 h-3.5 text-primary-content animate-fadeIn" fill="none" viewBox="0 0 24 24"
            stroke="currentColor" stroke-width="3">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
        </svg>
        }
    </div>

    @if (label()) {
    <span class="text-sm font-medium text-neutral-700 dark:text-neutral-200 select-none" (click)="toggle($event)">
        {{ label() }}
    </span>
    }
</label>
