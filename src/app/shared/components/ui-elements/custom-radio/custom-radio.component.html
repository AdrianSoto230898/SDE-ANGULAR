<div class="flex flex-col gap-2">
    @for (option of options(); track option.value) {
    <label class="inline-flex items-center gap-2 cursor-pointer" [class.opacity-60]="disabled() || isDisabled"
        [class.cursor-not-allowed]="disabled() || isDisabled">
        <div class="relative flex items-center justify-center w-5 h-5 rounded-full border transition-colors duration-200"
            [ngClass]="{
             'bg-primary border-primary dark:border-primary': selectedValue() === option.value,
             'bg-transparent border-neutral-300 dark:border-neutral-600': selectedValue() !== option.value
           }" (click)="selectOption(option.value)">

            <input type="radio" [name]="name()" class="sr-only" [value]="option.value"
                [checked]="selectedValue() === option.value" [disabled]="disabled() || isDisabled">

            @if (selectedValue() === option.value) {
            <div class="w-2 h-2 rounded-full bg-primary-content animate-fadeIn"></div>
            }
        </div>

        <span class="text-sm font-medium text-neutral-700 dark:text-neutral-200 select-none"
            (click)="selectOption(option.value)">
            {{ option.label }}
        </span>
    </label>
    }
</div>
