@if (loadingService.isLoading()) {

<!-- Overlay -->
<div
    class="fixed inset-0 z-[999] flex items-center justify-center bg-white/80 dark:bg-neutral-950/80 backdrop-blur-sm animate-fadeIn">

    <!-- Card central -->
    <div
        class="flex flex-col items-center gap-5 px-10 py-8 bg-white dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-800 rounded-2xl">

        <!-- Logo -->
        <img src="assets/images/logos/ternium-square.png" class="w-10 h-auto" alt="Ternium">

        <!-- Spinner SVG -->
        <div class="relative w-12 h-12">
            <!-- Track -->
            <svg class="absolute inset-0 w-full h-full -rotate-90" viewBox="0 0 48 48" fill="none">
                <circle cx="24" cy="24" r="20" stroke-width="3.5" class="stroke-neutral-200 dark:stroke-neutral-700" />
            </svg>
            <!-- Animated arc -->
            <svg class="absolute inset-0 w-full h-full -rotate-90 animate-spin" viewBox="0 0 48 48" fill="none"
                style="animation-duration: 900ms;">
                <circle cx="24" cy="24" r="20" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="125.6"
                    stroke-dashoffset="94" class="stroke-primary" />
            </svg>
        </div>

        <!-- Text -->
        <div class="text-center">
            <p class="text-sm font-semibold text-neutral-900 dark:text-white">Cargando</p>
            <p class="text-xs text-neutral-500 dark:text-neutral-400 mt-0.5">Espera un momento...</p>
        </div>

    </div>
</div>

}
