<!-- <ion-content [fullscreen]="true" [scrollY]="false" class="!p-0" style="--offset-top:0;--offset-bottom:0;"></ion-content> -->
<div class="bg-neutral-100 dark:bg-neutral-800">
  <div class="max-w-6xl mx-auto h-full flex flex-col px-6 pt-4 pb-[4rem]">

    <!-- Header -->
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3 mb-6">
      <div>
        <h1 class="text-xl font-black text-black dark:text-white">Artículos</h1>
        <p class="text-sm text-neutral-500 dark:text-neutral-400">
          Administra tu biblioteca de artículos: búsqueda rápida, edición sencilla y creación de nuevos contenidos.
        </p>
      </div>

      <button (click)="onCreate()"
        class="w-full md:w-auto px-6 h-10 rounded-full bg-primary text-white hover:opacity-90 text-sm">
        Nuevo
      </button>
    </div>

    <!-- Body con scroll -->
    <div class="flex-1 min-h-0 overflow-y-auto pb-8">

      <!-- Lista -->
      <div class="mt-4 rounded-2xl border border-neutral-200 dark:border-neutral-700 bg-white dark:bg-neutral-900">
        <div class="rounded-2xl">
          <!-- La tabla reutilizable -->
          <app-custom-table [title]="'Listado de Artículos'" [rows]="items" [columns]="columns" [loading]="loading"
            [itemsPerPage]="itemsPerPage" [itemsPerPageOptions]="[5,10,15]" [page]="currentPage"
            (itemsPerPageChange)="itemsPerPage=$event" (pageChange)="currentPage=$event" [clientSearch]="true"
            [searchableKeys]="['titulo','areaSubprocesoNombre','articuloTipoNombre','keywords']" (view)="onView($event)"
            (edit)="onEdit($event)" (delete)="onDelete($event)">
          </app-custom-table>
        </div>

      </div>
    </div>
  </div>
</div>

<dialog #myModal class="modal">
  <div class="modal-box modal-box w-11/12 max-w-lg bg-white dark:bg-neutral-800 rounded-lg shadow-lg p-2">
    <!-- Header -->
    <div class="flex items-center justify-end border-b border-neutral-200 dark:border-neutral-700 p-2">
      <button (click)="deleteOpen=false"
        class="w-10 h-10 rounded-full bg-transparent hover:bg-neutral-100 dark:hover:bg-neutral-900 flex items-center justify-center cursor-pointer">
        <span class="icon-[material-symbols--close-rounded] text-xl text-neutral-500 dark:text-neutral-300"></span>
      </button>
    </div>

    <!-- Body -->
    <div class="px-6 py-8 text-center">
      <div class="mx-auto mb-4 w-16 h-16 flex items-center justify-center rounded-full bg-red-100 dark:bg-red-900/30">
        <span class="icon-[material-symbols--delete-outline-rounded] text-3xl text-primary"></span>
      </div>
      <h2 class="text-lg font-bold text-black dark:text-white">Confirmación requerida</h2>
      <p class="text-sm text-neutral-600 dark:text-neutral-400 mt-2">
        ¿Seguro que deseas eliminar el articulo
        <b>{{ selectedRow?.titulo }}</b> de manera permanente?
      </p>
    </div>

    <!-- Footer -->
    <div class="border-t border-neutral-200 dark:border-neutral-700 px-6 py-6">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <button (click)="closeModal()"
          class="w-full px-6 h-11 rounded-full text-neutral-950 dark:text-neutral-50 bg-neutral-200 dark:bg-neutral-700 text-sm hover:bg-neutral-300 hover:dark:bg-neutral-600 transition">
          Cancelar
        </button>

        <button (click)="confirmDelete()"
          class="w-full px-6 h-11 rounded-full text-white bg-primary hover:bg-primary-hover transition active:scale-95 text-sm font-semibold">
          Sí, eliminar
        </button>
      </div>
    </div>
  </div>
</dialog>
